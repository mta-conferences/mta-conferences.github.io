site_name: "اندیشکده عقل و انگیزش"
site_description: "Institute of Cognition & Motive"
site_author: "اندیشکده عقل و انگیزش"
site_url: "https://aqloangizeh.ir"

use_directory_urls: true
theme:
  name: material
  language: fa
  direction: rtl
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/magazine.css

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{categories}/{slug}"
      pagination_per_page: 10
nav:
  - Home: index.md
  - Conferences:
      - First Conference: https://aqloangizeh.ir/The-Frist-Conference/
  - Articles: blog/index.md
  - About: about.md
